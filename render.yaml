services:
  - type: web
    name: postflow-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: POSTFLOW_APP_URL
        value: https://postflow-web-0iw9.onrender.com
      - key: POSTFLOW_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SOCIAL_TOKEN_ENC_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: LOVABLE_API_KEY
        sync: false
      - key: META_OAUTH_CLIENT_ID
        sync: false
      - key: META_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CONFIGURATION_ID
        value: "1081657210879915"
      - key: INSTAGRAM_OAUTH_CLIENT_ID
        sync: false
      - key: INSTAGRAM_OAUTH_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/callback/instagram
      - key: FACEBOOK_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/callback/facebook
      - key: PINTEREST_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/callback/pinterest
      - key: SNAPCHAT_OAUTH_CLIENT_ID
        sync: false
      - key: SNAPCHAT_OAUTH_CLIENT_SECRET
        sync: false
      - key: SNAPCHAT_OAUTH_PUBLIC_CLIENT_ID
        sync: false
      - key: SNAPCHAT_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/callback/snapchat
      - key: SNAPCHAT_PUBLIC_PROFILE_CLIENT_ID
        sync: false
      - key: SNAPCHAT_PUBLIC_PROFILE_CLIENT_SECRET
        sync: false
      - key: SNAPCHAT_PUBLIC_PROFILE_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/snapchat-public-profile/callback
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        value: https://postflow-web-0iw9.onrender.com/api/public/oauth/callback/youtube
      - key: PINTEREST_OAUTH_CLIENT_ID
        sync: false
      - key: PINTEREST_OAUTH_CLIENT_SECRET
        sync: false
      - key: MEDIA_PROCESSOR_URL
        sync: false
      - key: MEDIA_PROCESSOR_TOKEN
        sync: false
